name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Only keep the newest run per branch/PR; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 1.11 is the oldest version allowed by [compat] in Project.toml.
        # '1' tracks the newest stable release.
        version: ['1.11', '1']
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # Caches ~/.julia (packages, artifacts, compiled cache) keyed on the
      # Project/Manifest files, so repeat runs skip the ~4 min precompile.
      - uses: julia-actions/cache@v2

      - name: Instantiate the project environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.status()'

      # runtests.jl is a plain script (not a `Pkg.test` entrypoint), so run it
      # directly against the project environment - the same command a
      # developer runs locally from the repository root.
      - name: Run tests
        run: julia --project=. --color=yes test/runtests.jl
