name: Docs

on:
  push:
    branches:
      - main
    tags: ['*']

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time. Superseded runs are cancelled rather than queued.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
          arch: x64

      - uses: julia-actions/cache@v2

      # The docs environment is separate from the package's: it adds Documenter and
      # devs the package itself from the checkout, so the site documents this commit.
      - name: Instantiate the docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'

      - name: Build documentation
        run: julia --project=docs docs/make.jl

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Deploy pushes, manual runs, and pull requests raised from branches in this
    # repository. Never deploy an untrusted pull request from a fork.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
